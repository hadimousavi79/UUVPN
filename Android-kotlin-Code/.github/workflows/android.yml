# GitHub Actions Workflow for DeamonVPN Android App
# This workflow builds, tests, and packages the Android app securely using environment variables for secrets.

name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build, Test & Package Android App
    runs-on: ubuntu-latest
    env:
      # Secure environment variables (set in GitHub repo settings)
      SIGNING_KEYSTORE_PATH: ${{ secrets.SIGNING_KEYSTORE_PATH }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      CRISPTOKEN: ${{ secrets.CRISPTOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Configure signing.properties
        run: |
          echo "keystore.path=$SIGNING_KEYSTORE_PATH" > signing.properties
          echo "keystore.password=$SIGNING_KEYSTORE_PASSWORD" >> signing.properties
          echo "key.alias=$SIGNING_KEY_ALIAS" >> signing.properties
          echo "key.password=$SIGNING_KEY_PASSWORD" >> signing.properties

      - name: Build with Gradle
        run: ./gradlew app:assembleRelease

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeamonVPN-Android-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeamonVPN-Android-AAB
          path: app/build/outputs/bundle/release/*.aab

# Each step is documented for clarity and security best practices are followed.
